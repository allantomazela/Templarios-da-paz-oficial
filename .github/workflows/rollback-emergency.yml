name: Rollback emergência (baseline restauração)

on:
  workflow_dispatch:

jobs:
  rollback-server:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Baseline validado 26/06/2026 — ver docs/PONTO_RESTAURACAO.md
      # Tag: restore-point-2026-06-26 | Commit anterior emergência 24/06: 47b511d
      STABLE_COMMIT: a6175de

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.STABLE_COMMIT }}

      - name: Restaurar site e Nginx no servidor
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key"
          REMOTE="${USERNAME}@${HOST}"

          scp $SSH_OPTS docs/nginx-templarios-stable.conf scripts/rollback-server-production.sh "$REMOTE:/tmp/"
          ssh $SSH_OPTS "$REMOTE" "chmod +x /tmp/rollback-server-production.sh && bash /tmp/rollback-server-production.sh /tmp/nginx-templarios-stable.conf"

      - name: Build e deploy do commit estável (baseline restauração)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps
          npm run build

          MAIN_JS=$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html | head -1 | sed 's/.*src="\/assets\///;s/"//')
          test -f "dist/assets/$MAIN_JS"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/deploy_key"
          REMOTE="${USERNAME}@${HOST}"
          LIVE="/var/www/templarios"
          NEXT="/var/www/templarios-next"

          ssh $SSH_OPTS "$REMOTE" "rm -rf '$NEXT' && mkdir -p '$NEXT'"
          rsync -avz -e "ssh $SSH_OPTS" dist/ "$REMOTE:$NEXT/"

          ssh $SSH_OPTS "$REMOTE" "
            set -e
            rm -rf '${LIVE}.old'
            [ -d '$LIVE' ] && mv '$LIVE' '${LIVE}.old'
            mv '$NEXT' '$LIVE'
            chown -R www-data:www-data '$LIVE'
          "

          curl -4 --http1.1 -fSL --max-time 90 -o /tmp/smoke.js \
            "https://www.templariosdapazoficial.com.br/assets/$MAIN_JS"
          echo "Deploy estável OK: assets/$MAIN_JS ($(stat -c%s /tmp/smoke.js) bytes)"
