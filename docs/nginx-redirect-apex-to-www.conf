# Redirecionamento: templariosdapazoficial.com.br → www.templariosdapazoficial.com.br
#
# O domínio sem "www" (apex) não abre o site porque o Nginx está configurado
# apenas para server_name www.templariosdapazoficial.com.br. Este bloco faz
# o apex redirecionar permanentemente (301) para o www.
#
# COMO USAR NO SERVIDOR:
# 1. Inclua este bloco no Nginx ANTES do server block principal (que tem www).
#    Ou crie um arquivo em /etc/nginx/sites-available/ e ative com symlink
#    em sites-enabled.
# 2. Teste: sudo nginx -t
# 3. Recarregue: sudo systemctl reload nginx
#
# DNS: O domínio apex (templariosdapazoficial.com.br) deve apontar para
# o mesmo IP do servidor (registro A ou ALIAS), para que esta regra funcione.

server {
    listen 80;
    listen [::]:80;
    server_name templariosdapazoficial.com.br;
    return 301 https://www.templariosdapazoficial.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name templariosdapazoficial.com.br;
    # Use os mesmos certificados do www ou um certificado para o apex
    # ssl_certificate /etc/letsencrypt/live/templariosdapazoficial.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/templariosdapazoficial.com.br/privkey.pem;
    return 301 https://www.templariosdapazoficial.com.br$request_uri;
}
