name: Deploy Templarios da Paz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixando código
      uses: actions/checkout@v4

    - name: 2. Instalando pnpm
      uses: pnpm/action-setup@v4

    - name: 3. Configurando Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: 4. Instalando dependências
      run: pnpm install --frozen-lockfile

    - name: 5. Lint e testes
      run: |
        pnpm run lint
        pnpm run test

    - name: 6. Buildando
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      run: pnpm run build

    - name: 7. Enviando build para o servidor
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USERNAME}@${HOST} "mkdir -p /var/www/templarios"
        rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
          dist/ \
          ${USERNAME}@${HOST}:/var/www/templarios/
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USERNAME}@${HOST} \
          "chown -R www-data:www-data /var/www/templarios && echo '✅ Site atualizado!'"
