name: Deploy Templarios da Paz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Actions oficiais em Node 24 (padrão GitHub a partir de jun/2026)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 1. Baixando código
      uses: actions/checkout@v6

    - name: 2. Configurando Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 3. Instalando dependências
      run: npm install --legacy-peer-deps

    - name: 4. Lint e testes
      run: |
        npm run lint
        npm run test

    - name: 5. Buildando
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      run: |
        if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
          echo "::error::Secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_PUBLISHABLE_KEY não configurados em GitHub → Settings → Secrets → Actions."
          exit 1
        fi
        npm run build

    # dist/ contém index.html, assets/ e tudo que está em public/ (favicon, icon-192, icon-512, manifest, sw.js)
    - name: 6. Enviando build para o servidor
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ConnectionAttempts=3 -i ~/.ssh/deploy_key"
        REMOTE="${USERNAME}@${HOST}"
        LIVE="/var/www/templarios"
        NEXT="/var/www/templarios-next"

        MAIN_JS=$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html | head -1 | sed 's/.*src="\/assets\///;s/"//')
        MAIN_CSS=$(grep -oE 'href="/assets/index-[^"]+\.css"' dist/index.html | head -1 | sed 's/.*href="\/assets\///;s/"//')

        if [ -z "$MAIN_JS" ] || [ ! -f "dist/assets/$MAIN_JS" ]; then
          echo "::error::Bundle principal JS não encontrado em dist/"
          exit 1
        fi

        JS_SIZE=$(stat -c%s "dist/assets/$MAIN_JS")
        if [ "$JS_SIZE" -lt 100000 ]; then
          echo "::error::Bundle principal muito pequeno ($JS_SIZE bytes): $MAIN_JS"
          exit 1
        fi

        echo "Bundle principal local: assets/$MAIN_JS ($JS_SIZE bytes)"
        if [ -n "$MAIN_CSS" ] && [ ! -f "dist/assets/$MAIN_CSS" ]; then
          echo "::error::CSS principal não encontrado: $MAIN_CSS"
          exit 1
        fi

        deploy() {
          ssh $SSH_OPTS "$REMOTE" "rm -rf '$NEXT' && mkdir -p '$NEXT'"
          rsync -avz --partial --delay-updates -e "ssh $SSH_OPTS" dist/ "$REMOTE:$NEXT/"
          ssh $SSH_OPTS "$REMOTE" "
            set -e
            test -f '$NEXT/index.html'
            test -f '$NEXT/assets/$MAIN_JS'
            JS_REMOTE=\$(stat -c%s '$NEXT/assets/$MAIN_JS')
            test \"\$JS_REMOTE\" -ge 100000
            rm -rf '${LIVE}.old'
            if [ -d '$LIVE' ]; then mv '$LIVE' '${LIVE}.old'; fi
            mv '$NEXT' '$LIVE'
            chown -R www-data:www-data '$LIVE'
            echo 'Site atualizado com swap atomico'
          "

          CODE_HTML=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "https://www.templariosdapazoficial.com.br/")
          CODE_JS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "https://www.templariosdapazoficial.com.br/assets/$MAIN_JS")
          echo "Verificação pós-deploy: / -> HTTP $CODE_HTML, /assets/$MAIN_JS -> HTTP $CODE_JS"
          if [ "$CODE_HTML" != "200" ] || [ "$CODE_JS" != "200" ]; then
            echo "::error::Verificação pós-deploy falhou (HTML=$CODE_HTML JS=$CODE_JS)"
            exit 1
          fi
        }

        for i in 1 2 3; do
          echo "Tentativa $i de 3..."
          if deploy; then
            scp $SSH_OPTS docs/nginx-templarios-stable.conf scripts/apply-stable-nginx.sh scripts/check-ssl-production.sh "$REMOTE:/tmp/"
            ssh $SSH_OPTS "$REMOTE" "
              mkdir -p /opt/templarios/scripts
              install -m 755 /tmp/apply-stable-nginx.sh /tmp/check-ssl-production.sh /opt/templarios/scripts/
              bash /opt/templarios/scripts/apply-stable-nginx.sh /tmp/nginx-templarios-stable.conf
            "

            curl -4 --http1.1 -fSL --max-time 90 -o /tmp/smoke-main.js \
              "https://www.templariosdapazoficial.com.br/assets/$MAIN_JS"
            SMOKE_SIZE=$(stat -c%s /tmp/smoke-main.js)
            if [ "$SMOKE_SIZE" -lt 100000 ]; then
              echo "::error::Smoke GET falhou: apenas $SMOKE_SIZE bytes de $MAIN_JS"
              exit 1
            fi
            echo "Smoke GET OK: $SMOKE_SIZE bytes"
            exit 0
          fi
          [ $i -lt 3 ] && echo "Falha na conexão, nova tentativa em 10s..." && sleep 10
        done
        echo "Deploy falhou após 3 tentativas."
        exit 1
