# Config Nginx — produção Vultr (certbot: templariosdapazoficial.com.br)
# Corrige ERR_CONNECTION_RESET: sem http2, sendfile off, try_files em /assets/

server {
    listen 80;
    listen [::]:80;
    server_name templariosdapazoficial.com.br www.templariosdapazoficial.com.br;
    return 301 https://$host$request_uri;
}

server {
    # SEM http2 — no Vultr costuma causar reset no corpo da resposta HTTPS
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name templariosdapazoficial.com.br www.templariosdapazoficial.com.br;

    root /var/www/templarios;
    index index.html;
    sendfile off;
    aio off;
    tcp_nopush off;

    access_log /var/log/nginx/templarios_access.log;
    error_log /var/log/nginx/templarios_error.log;

    ssl_certificate /etc/letsencrypt/live/templariosdapazoficial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/templariosdapazoficial.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_buffer_size 4k;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri =404;
    }

    location /assets/ {
        sendfile off;
        aio off;
        gzip on;
        gzip_types application/javascript text/css;
        gzip_min_length 256;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        sendfile off;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }
}
