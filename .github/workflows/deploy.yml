name: Deploy Templarios da Paz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 1. Baixando código
      uses: actions/checkout@v6

    - name: 2. Configurando Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 3. Instalando dependências
      run: npm install --legacy-peer-deps

    - name: 4. Lint e testes
      run: |
        npm run lint
        npm run test

    - name: 5. Buildando
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      run: |
        if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
          echo "::error::Secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_PUBLISHABLE_KEY não configurados."
          exit 1
        fi
        npm run build

    - name: 6. Enviando build para o servidor
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ConnectionAttempts=3 -i ~/.ssh/deploy_key"
        REMOTE="${USERNAME}@${HOST}"
        LIVE="/var/www/templarios"
        NEXT="/var/www/templarios-next"
        LEGACY="/var/www/templarios-assets-legacy"

        MAIN_JS=$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html | head -1 | sed 's/.*src="\/assets\///;s/"//')

        if [ -z "$MAIN_JS" ] || [ ! -f "dist/assets/$MAIN_JS" ]; then
          echo "::error::Bundle principal JS não encontrado em dist/"
          exit 1
        fi

        JS_SIZE=$(stat -c%s "dist/assets/$MAIN_JS")
        if [ "$JS_SIZE" -lt 50000 ]; then
          echo "::error::Bundle principal muito pequeno ($JS_SIZE bytes): $MAIN_JS"
          exit 1
        fi

        echo "Bundle principal: assets/$MAIN_JS ($JS_SIZE bytes)"

        ssh $SSH_OPTS "$REMOTE" "rm -rf '$NEXT' && mkdir -p '$NEXT'"
        rsync -avz --partial --delay-updates --timeout=300 -e "ssh $SSH_OPTS" dist/ "$REMOTE:$NEXT/"

        ssh $SSH_OPTS "$REMOTE" "bash -s" <<SWAP
        set -e
        NEXT='$NEXT'
        LIVE='$LIVE'
        LEGACY='$LEGACY'
        MAIN_JS='$MAIN_JS'

        test -f "\$NEXT/index.html"
        test -f "\$NEXT/assets/\$MAIN_JS"
        test "\$(stat -c%s "\$NEXT/assets/\$MAIN_JS")" -ge 50000

        mkdir -p "\$LEGACY"
        if [ -d "\$LIVE/assets" ]; then
          cp -a --update=none "\$LIVE/assets/." "\$LEGACY/" || true
        fi

        rm -rf "\${LIVE}.old"
        if [ -d "\$LIVE" ]; then mv "\$LIVE" "\${LIVE}.old"; fi
        mv "\$NEXT" "\$LIVE"

        mkdir -p "\$LIVE/assets"
        cp -a --update=none "\$LEGACY/." "\$LIVE/assets/" || true

        chown -R www-data:www-data "\$LIVE"
        echo "Deploy concluido: \$LIVE/assets/\$MAIN_JS"
        SWAP

        ssh $SSH_OPTS "$REMOTE" "test -f '$LIVE/index.html' && test -f '$LIVE/assets/$MAIN_JS'"
        echo "Arquivos confirmados no servidor."
