# Nginx estável — produção Templários (restaurado 24/06/2026)
# Sem http2, sendfile off, locations simples.

server {
    listen 80;
    listen [::]:80;
    server_name templariosdapazoficial.com.br www.templariosdapazoficial.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name templariosdapazoficial.com.br www.templariosdapazoficial.com.br;

    root /var/www/templarios;
    index index.html;
    sendfile off;

    access_log /var/log/nginx/templarios_access.log;
    error_log /var/log/nginx/templarios_error.log;

    ssl_certificate /etc/letsencrypt/live/templariosdapazoficial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/templariosdapazoficial.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        sendfile off;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
