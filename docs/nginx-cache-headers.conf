# Snippet para nginx: evita cache do index.html (evita 404 em chunks após deploy).
# Inclua dentro do server { } que serve o site (ex.: location / { ... }).
#
# Exemplo de uso no server block:
#
#   location / {
#     root /var/www/templarios;
#     try_files $uri $uri/ /index.html;
#     include /path/to/nginx-cache-headers.conf;  # ou cole as linhas abaixo
#   }
#
# Ou adicione dentro do location / que já existe:
#
#   location = /index.html {
#     add_header Cache-Control "no-cache, no-store, must-revalidate";
#     add_header Pragma "no-cache";
#     add_header Expires "0";
#   }
#   location /assets/ {
#     add_header Cache-Control "max-age=31536000, immutable";
#   }
