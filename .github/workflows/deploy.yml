name: Deploy Templarios da Paz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixando código do GitHub
      uses: actions/checkout@v2

    - name: 2. Instalando Dependências e Buildando (GitHub)
      # Adicionado --legacy-peer-deps para ignorar conflitos de versão
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: 3. Enviando para o Servidor
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          echo "🚀 Iniciando Deploy Templários..."
          
          # Vai para a pasta do projeto NOVO
          cd /var/www/templarios
          
          # Verifica se o git já foi iniciado, se não, clona
          if [ ! -d ".git" ]; then
            git clone https://github.com/allantomazela/Templarios-da-paz-oficial.git .
          fi

          # Baixa as novidades
          git fetch --all
          git reset --hard origin/main
          
          # Instala e Builda NO SERVIDOR (garante que roda igual ao Tatame)
          # AQUI TAMBÉM: Adicionado --legacy-peer-deps
          npm install --legacy-peer-deps
          npm run build
          
          # Ajusta permissões
          chown -R www-data:www-data /var/www/templarios
          
          echo "✅ Site Templários atualizado!"