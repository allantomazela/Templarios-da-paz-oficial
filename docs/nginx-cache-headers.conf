# Cache para SPA (Vite/React) - evita 404 em chunks após deploy
#
# BUILD ATUAL: nomes estáveis (assets/index.js, assets/index.css, etc.) - ver vite.config.ts rollupOptions.
# Com nomes estáveis, index.html E /assets/ NÃO devem ser cacheados por muito tempo, senão o mobile
# continua com JS/CSS antigo após deploy. O Service Worker (sw.js) já usa network-first para JS/CSS.
#
# Se no futuro usar hashes (ex.: index-zahyOeOu.js): a cada deploy os hashes mudam; aí sim
# pode cachear /assets/ com max-age longo e só index.html com no-cache.
#
# ERRO COMUM: GET /assets/index.js net::ERR_ABORTED 404
# - Causa 1: Deploy não enviou a pasta dist/assets/ (só index.html ou root errado).
# - Causa 2: Nginx não tem location /assets/ ou a ordem está errada (fallback para index.html em vez de servir o arquivo).
#
# SOLUÇÃO: (1) Deploy deve publicar a pasta INTEIRA dist/ (index.html + assets/ + tudo). (2) Nginx abaixo.
#
# Uso no Nginx (dentro do server { } que serve o site):
# IMPORTANTE: location /assets/ deve vir ANTES de location / para não cair no try_files de SPA.
#
#   server {
#     server_name www.templariosdapazoficial.com.br;   # use www; para apex→www use docs/nginx-redirect-apex-to-www.conf
#     root /var/www/templarios;   # Deve ser a pasta que contém index.html E a subpasta assets/
#
#     location = /index.html {
#       add_header Cache-Control "no-cache, no-store, must-revalidate";
#       add_header Pragma "no-cache";
#       add_header Expires "0";
#       try_files $uri =404;
#     }
#
#     # Com nomes estáveis: cache curto para assets para mobile/Chrome verem atualizações após deploy
#     location /assets/ {
#       add_header Cache-Control "no-cache, must-revalidate";
#       try_files $uri =404;
#     }
#
#     location / {
#       try_files $uri $uri/ /index.html;
#       add_header Cache-Control "no-cache, no-store, must-revalidate";
#     }
#   }
#
# Após alterar, recarregue o Nginx: sudo nginx -t && sudo systemctl reload nginx

# Snippet mínimo para incluir em um location / existente:
#   location = /index.html {
#     add_header Cache-Control "no-cache, no-store, must-revalidate";
#     add_header Pragma "no-cache";
#     add_header Expires "0";
#   }
#   location /assets/ {
#     add_header Cache-Control "no-cache, must-revalidate";
#   }
