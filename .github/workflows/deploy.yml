name: Deploy Templarios da Paz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 1. Baixando código
      uses: actions/checkout@v6

    - name: 2. Configurando Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 3. Instalando dependências
      run: npm install --legacy-peer-deps

    - name: 4. Lint e testes
      run: |
        npm run lint
        npm run test

    - name: 5. Buildando
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      run: |
        if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
          echo "::error::Secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_PUBLISHABLE_KEY não configurados."
          exit 1
        fi
        npm run build

    - name: 6. Enviando build para o servidor
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ConnectionAttempts=3 -i ~/.ssh/deploy_key"
        REMOTE="${USERNAME}@${HOST}"
        LIVE="/var/www/templarios"
        NEXT="/var/www/templarios-next"

        MAIN_JS=$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html | head -1 | sed 's/.*src="\/assets\///;s/"//')
        MAIN_CSS=$(grep -oE 'href="/assets/index-[^"]+\.css"' dist/index.html | head -1 | sed 's/.*href="\/assets\///;s/"//')
        LARGEST_JS=$(find dist/assets -name '*.js' -printf '%f %s\n' | sort -k2 -n | tail -1 | awk '{print $1}')
        LARGEST_JS_SIZE=$(stat -c%s "dist/assets/$LARGEST_JS")
        JS_FILE_COUNT=$(find dist/assets -name '*.js' | wc -l)

        if [ -z "$MAIN_JS" ] || [ ! -f "dist/assets/$MAIN_JS" ]; then
          echo "::error::Bundle principal JS não encontrado em dist/"
          exit 1
        fi

        JS_SIZE=$(stat -c%s "dist/assets/$MAIN_JS")
        if [ "$JS_SIZE" -lt 50000 ]; then
          echo "::error::Bundle principal muito pequeno ($JS_SIZE bytes): $MAIN_JS"
          exit 1
        fi

        if [ "$LARGEST_JS_SIZE" -gt 393216 ]; then
          echo "::error::Chunk JS acima de 384KB ($LARGEST_JS $LARGEST_JS_SIZE bytes)."
          exit 1
        fi

        if [ "$JS_FILE_COUNT" -gt 250 ]; then
          echo "::warning::Muitos chunks JS ($JS_FILE_COUNT); considere consolidar vendors."
        fi

        echo "Bundle principal: assets/$MAIN_JS ($JS_SIZE bytes)"
        echo "Maior chunk: assets/$LARGEST_JS ($LARGEST_JS_SIZE bytes)"
        echo "Total de arquivos JS em assets/: $JS_FILE_COUNT"
        if [ -n "$MAIN_CSS" ] && [ ! -f "dist/assets/$MAIN_CSS" ]; then
          echo "::error::CSS principal não encontrado: $MAIN_CSS"
          exit 1
        fi

        verify_on_server() {
          local path="$1"
          local min_bytes="$2"
          ssh $SSH_OPTS "$REMOTE" "bash -s" <<VERIFY
        set -e
        out=\$(curl -4 -sS -o /tmp/verify-body -w '%{http_code} %{size_download}' --max-time 90 \
          -H 'Host: www.templariosdapazoficial.com.br' "http://127.0.0.1${path}")
        code=\$(echo "\$out" | awk '{print \$1}')
        size=\$(echo "\$out" | awk '{print \$2}')
        echo "LOCAL GET ${path} -> HTTP \$code size=\$size (min ${min_bytes})"
        [ "\$code" = "200" ] && [ "\$size" -ge "${min_bytes}" ]
VERIFY
        }

        rollback_live() {
          echo "Tentando rollback para ${LIVE}.old ..."
          ssh $SSH_OPTS "$REMOTE" 'bash -s' <<ROLLBACK
        set -e
        LIVE='$LIVE'
        if [ -d "\${LIVE}.old" ]; then
          rm -rf "\$LIVE"
          mv "\${LIVE}.old" "\$LIVE"
          chown -R www-data:www-data "\$LIVE"
          echo "Rollback concluído."
        else
          echo "Nenhum backup ${LIVE}.old disponível."
          exit 1
        fi
        ROLLBACK
        }

        apply_nginx_fix() {
          scp $SSH_OPTS scripts/patch-nginx-assets.sh "$REMOTE:/tmp/patch-nginx-assets.sh"
          if ssh $SSH_OPTS "$REMOTE" "chmod +x /tmp/patch-nginx-assets.sh && sudo /tmp/patch-nginx-assets.sh '$LIVE'"; then
            echo "Patch Nginx aplicado."
            return 0
          fi
          echo "::warning::Patch Nginx falhou; tentando sed inline..."
          ssh $SSH_OPTS "$REMOTE" "bash -s" <<'SED' || return 1
        set -e
        LIVE='/var/www/templarios'
        patched=0
        for conf in /etc/nginx/sites-enabled/*; do
          [ -f "\$conf" ] || continue
          grep -q "root \${LIVE}" "\$conf" || continue
          sudo cp "\$conf" "\${conf}.bak-inline"
          sudo sed -i 's/sendfile[[:space:]]*on;/sendfile off;/g' "\$conf"
          patched=1
        done
        [ "\$patched" -eq 1 ]
        sudo nginx -t
        sudo systemctl reload nginx
        echo "sed inline OK"
SED
        }

        deploy_once() {
          ssh $SSH_OPTS "$REMOTE" "rm -rf '$NEXT' && mkdir -p '$NEXT'"
          rsync -avz --partial --delay-updates --timeout=300 -e "ssh $SSH_OPTS" dist/ "$REMOTE:$NEXT/"

          ssh $SSH_OPTS "$REMOTE" 'bash -s' <<SWAP
        set -e
        NEXT='$NEXT'
        LIVE='$LIVE'
        MAIN_JS='$MAIN_JS'

        test -f "\$NEXT/index.html"
        test -f "\$NEXT/assets/\$MAIN_JS"
        JS_REMOTE=\$(stat -c%s "\$NEXT/assets/\$MAIN_JS")
        test "\$JS_REMOTE" -ge 50000

        rm -rf "\${LIVE}.old"
        if [ -d "\$LIVE" ]; then mv "\$LIVE" "\${LIVE}.old"; fi
        mv "\$NEXT" "\$LIVE"
        chown -R www-data:www-data "\$LIVE"
        echo "Swap atomico concluido."
        SWAP

          apply_nginx_fix || echo "::warning::Nginx nao patchado; site pode continuar com ERR_CONNECTION_RESET."

          verify_on_server "/" 1000 || return 1
          verify_on_server "/assets/$MAIN_JS" 50000 || return 1
          verify_on_server "/assets/$LARGEST_JS" 10000 || return 1

          RADIX_JS=$(grep -oE 'vendor-radix-[^"]+\.js' dist/index.html | head -1 || true)
          if [ -n "$RADIX_JS" ]; then
            verify_on_server "/assets/$RADIX_JS" 10000 || return 1
          fi
        }

        for i in 1 2 3; do
          echo "Tentativa $i de 3..."
          if deploy_once; then
            echo "Deploy e verificação concluídos com sucesso."
            exit 0
          fi
          rollback_live || true
          [ "$i" -lt 3 ] && echo "Nova tentativa em 10s..." && sleep 10
        done

        echo "::error::Deploy falhou após 3 tentativas."
        exit 1
