<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#007AFF" />
    <title>Templários da Paz</title>
    <meta
      name="description"
      content="Augusta e Respeitável Loja Simbólica Templários da Paz 3969, oriente de Botucatu-SP"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="keywords" content="Templários da Paz" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Ícone ao instalar no dispositivo; usa favicon para evitar erro de tamanho no manifest -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Favicon fallback; SeoManager atualiza com logo do site quando configurado -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>

  <body>
    <div id="boot-fallback" style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#444;background:#fafafa">
      <p>Carregando sistema…</p>
    </div>
    <div id="root"></div>
    <!-- Recarrega a página quando o navegador tiver index.html em cache e os assets (JS/CSS) retornarem 404 (deploy novo) -->
    <script>
      (function () {
        var key = 'templarios-asset-reload'
        if (/[?&]t=\d+/.test(window.location.search)) {
          sessionStorage.removeItem(key)
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && (t.src || t.href)) {
            var url = t.src || t.href
            if (url.indexOf('/assets/') === -1) return
            if (sessionStorage.getItem(key) !== '1') {
              sessionStorage.setItem(key, '1')
              window.location.replace(window.location.pathname + '?t=' + Date.now())
            }
          }
        }, true)

        window.setTimeout(function () {
          var root = document.getElementById('root')
          var boot = document.getElementById('boot-fallback')
          if (!boot || !root || root.innerHTML.trim()) {
            if (boot) boot.style.display = 'none'
            return
          }
          boot.innerHTML =
            '<div style="max-width:28rem;padding:1.5rem;text-align:center;border:1px solid #e5e5e5;border-radius:0.75rem;background:#fff">' +
            '<p style="font-weight:600;margin:0 0 0.5rem">Não foi possível carregar o sistema</p>' +
            '<p style="font-size:0.875rem;color:#666;margin:0 0 1rem">Arquivos do site podem estar incompletos após o deploy. Tente recarregar ou limpe o cache.</p>' +
            '<button type="button" onclick="location.reload()" style="padding:0.5rem 1rem;border:1px solid #ccc;border-radius:0.5rem;background:#fff;cursor:pointer">Recarregar</button>' +
            '</div>'
        }, 8000)

        new MutationObserver(function () {
          var root = document.getElementById('root')
          var boot = document.getElementById('boot-fallback')
          if (root && root.innerHTML.trim() && boot) boot.style.display = 'none'
        }).observe(document.getElementById('root'), { childList: true, subtree: true })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
