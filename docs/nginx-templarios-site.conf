# Site Templários da Paz — config Nginx (www)
# Copiado pelo CI para /etc/nginx/sites-available/templarios no deploy.
#
# Corrige reset de conexão em JS grande: sendfile off em /assets/ e try_files explícito.

server {
    listen 80;
    listen [::]:80;
    server_name templariosdapazoficial.com.br www.templariosdapazoficial.com.br;
    return 301 https://www.templariosdapazoficial.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.templariosdapazoficial.com.br;

    root /var/www/templarios;
    index index.html;

    # Ajuste os caminhos do certificado conforme o certbot no servidor
    ssl_certificate /etc/letsencrypt/live/www.templariosdapazoficial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.templariosdapazoficial.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    sendfile off;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location /assets/ {
        sendfile off;
        aio off;
        directio off;
        gzip on;
        gzip_types application/javascript text/css;
        gzip_min_length 256;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name templariosdapazoficial.com.br;

    ssl_certificate /etc/letsencrypt/live/www.templariosdapazoficial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.templariosdapazoficial.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.templariosdapazoficial.com.br$request_uri;
}
