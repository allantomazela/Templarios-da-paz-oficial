<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#007AFF" />
    <title>Templários da Paz</title>
    <meta
      name="description"
      content="Augusta e Respeitável Loja Simbólica Templários da Paz 3969, oriente de Botucatu-SP"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Ícone ao instalar no dispositivo; usa favicon para evitar erro de tamanho no manifest -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Favicon fallback; SeoManager atualiza com logo do site quando configurado -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>

  <body>
    <div id="boot-fallback" style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#444;background:#fafafa">
      <p>Carregando sistema…</p>
    </div>
    <div id="root"></div>
    <!-- Se assets falharem após deploy, mostra erro claro (sem redirecionar para ?t=) -->
    <script>
      (function () {
        var boot = document.getElementById('boot-fallback')
        var failed = []

        window.addEventListener('error', function (e) {
          var t = e.target
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return
          var url = t.src || t.href
          if (!url || url.indexOf('/assets/') === -1) return
          if (failed.indexOf(url) === -1) failed.push(url)
        }, true)

        window.setTimeout(function () {
          var root = document.getElementById('root')
          if (!boot || !root || root.innerHTML.trim()) {
            if (boot) boot.style.display = 'none'
            return
          }
          var list = failed.length
            ? '<ul style="text-align:left;font-size:0.75rem;color:#666;margin:0.5rem 0 0;padding-left:1.2rem">' +
              failed.slice(0, 5).map(function (u) {
                return '<li>' + u.replace(location.origin, '') + '</li>'
              }).join('') +
              '</ul>'
            : ''
          boot.innerHTML =
            '<div style="max-width:32rem;padding:1.5rem;text-align:center;border:1px solid #e5e5e5;border-radius:0.75rem;background:#fff">' +
            '<p style="font-weight:600;margin:0 0 0.5rem">Não foi possível carregar o sistema</p>' +
            '<p style="font-size:0.875rem;color:#666;margin:0">Limpe o cache do site (Ctrl+Shift+R ou dados do site no celular). Se persistir, avise o administrador.</p>' +
            list +
            '<button type="button" onclick="location.href=location.pathname" style="margin-top:1rem;padding:0.5rem 1rem;border:1px solid #ccc;border-radius:0.5rem;background:#fff;cursor:pointer">Tentar novamente</button>' +
            '</div>'
        }, 10000)

        new MutationObserver(function () {
          var root = document.getElementById('root')
          var boot = document.getElementById('boot-fallback')
          if (root && root.innerHTML.trim() && boot) boot.style.display = 'none'
        }).observe(document.getElementById('root'), { childList: true, subtree: true })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
