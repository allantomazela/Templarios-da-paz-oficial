name: Corrigir Nginx (emergência)

on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Aplicar config Nginx de producao
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/deploy_key"
          REMOTE="${USERNAME}@${HOST}"

          scp $SSH_OPTS docs/nginx-templarios-vultr.conf scripts/apply-production-nginx.sh "$REMOTE:/tmp/"
          ssh $SSH_OPTS "$REMOTE" "chmod +x /tmp/apply-production-nginx.sh && sudo bash /tmp/apply-production-nginx.sh"
