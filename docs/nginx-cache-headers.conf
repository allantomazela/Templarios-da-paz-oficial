# Cache para SPA (Vite/React) - evita 404 em chunks após deploy
# Os arquivos em /assets/ têm hash no nome (ex.: Secretariat-BSUTlHkB.js); a cada deploy os hashes mudam.
# Se o index.html for cacheado, o usuário continua pedindo chunks antigos que não existem mais → 404.
#
# SOLUÇÃO: NUNCA cachear index.html. Cachear apenas /assets/ (imutáveis por causa do hash).
#
# Uso no Nginx (dentro do server { } que serve o site):
#
#   server {
#     server_name templariosdapazoficial.com.br;
#     root /var/www/templarios;   # ou onde estiver o dist/
#
#     location = /index.html {
#       add_header Cache-Control "no-cache, no-store, must-revalidate";
#       add_header Pragma "no-cache";
#       add_header Expires "0";
#       try_files $uri =404;
#     }
#
#     location /assets/ {
#       add_header Cache-Control "max-age=31536000, immutable";
#       try_files $uri =404;
#     }
#
#     location / {
#       try_files $uri $uri/ /index.html;
#       add_header Cache-Control "no-cache, no-store, must-revalidate";
#     }
#   }
#
# Após alterar, recarregue o Nginx: sudo nginx -t && sudo systemctl reload nginx

# Snippet mínimo para incluir em um location / existente:
#   location = /index.html {
