name: Deploy Templarios da Paz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixando código
      uses: actions/checkout@v4

    - name: 2. Configurando Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 3. Instalando dependências
      run: npm install --legacy-peer-deps

    - name: 4. Lint e testes
      run: |
        npm run lint
        npm run test

    - name: 5. Buildando
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      run: npm run build

    # dist/ contém index.html, assets/ e tudo que está em public/ (favicon, icon-192, icon-512, manifest, sw.js)
    - name: 6. Enviando build para o servidor
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ConnectionAttempts=3 -i ~/.ssh/deploy_key"
        deploy() {
          ssh $SSH_OPTS ${USERNAME}@${HOST} "mkdir -p /var/www/templarios"
          rsync -avz --delete -e "ssh $SSH_OPTS" dist/ ${USERNAME}@${HOST}:/var/www/templarios/
          ssh $SSH_OPTS ${USERNAME}@${HOST} "chown -R www-data:www-data /var/www/templarios && echo '✅ Site atualizado!'"
        }
        for i in 1 2 3; do
          echo "Tentativa $i de 3..."
          if deploy; then exit 0; fi
          [ $i -lt 3 ] && echo "Falha na conexão, nova tentativa em 10s..." && sleep 10
        done
        echo "Deploy falhou após 3 tentativas."
        exit 1
