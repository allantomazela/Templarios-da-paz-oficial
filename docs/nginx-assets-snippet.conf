# Snippet seguro: apenas otimiza entrega de /assets/ sem substituir o server block inteiro.
# O CI copia para /etc/nginx/snippets/templarios-assets.conf e inclui no site existente.

location /assets/ {
    sendfile off;
    aio off;
    directio off;
    gzip on;
    gzip_types application/javascript text/css;
    gzip_min_length 256;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
}
