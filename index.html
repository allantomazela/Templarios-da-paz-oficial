<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#007AFF" />
    <title>Templários da Paz</title>
    <meta
      name="description"
      content="Augusta e Respeitável Loja Simbólica Templários da Paz 3969, oriente de Botucatu-SP"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="keywords" content="Templários da Paz" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap"
      rel="stylesheet"
    />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Ícone ao instalar no dispositivo; usa favicon para evitar erro de tamanho no manifest -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Favicon fallback; SeoManager atualiza com logo do site quando configurado -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Recarrega a página quando o navegador tiver index.html em cache e os assets (JS/CSS) retornarem 404 (deploy novo) -->
    <script>
      (function () {
        var key = 'templarios-asset-reload'
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && (t.src || t.href)) {
            if (sessionStorage.getItem(key) !== '1') {
              sessionStorage.setItem(key, '1')
              window.location.replace(window.location.pathname + '?t=' + Date.now())
            }
          }
        }, true)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
